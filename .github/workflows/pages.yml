#  Builds the site with Eleventy on every pull request, so a broken
#  comment block fails the PR, and deploys it to GitHub Pages on every
#  push to main.
#
#  Actions are pinned to commits, the same as Saxby's workflows.

name: Pages

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              # v7.0.1
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Set up Node
              # v7.1.0
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: lts/*
                  cache: npm

            - name: Install
              run: npm ci

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - name: Upload site
              if: github.event_name != 'pull_request'
              # v5.0.0
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
              with:
                  path: _site

    deploy:
        if: >-
            github.event_name != 'pull_request' &&
            github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - name: Deploy
              id: deploy
              # v5.0.1
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
